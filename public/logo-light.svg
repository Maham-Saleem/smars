<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFF9F2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5EFE6;stop-opacity:1" />
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  
  <!-- Main SMAR'S text with distressed effect -->
  <text x="200" y="55" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="700" fill="url(#white)" text-anchor="middle" letter-spacing="8" filter="url(#grain)">SMAR'S</text>
  
  <!-- FRAGRANCE text between -->
  <text x="200" y="72" font-family="'Playfair Display', Georgia, serif" font-size="11" fill="url(#white)" text-anchor="middle" letter-spacing="12" opacity="0.8">FRAGRANCE</text>
  
  <!-- Tagline -->
  <text x="200" y="105" font-family="'Playfair Display', Georgia, serif" font-size="13" fill="url(#white)" text-anchor="middle" letter-spacing="2" font-style="italic" opacity="0.7">Scents that defines you.</text>
</svg>
