<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E1F14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a130f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C7A36B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8D5B5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A8884D;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#C7A36B;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#C7A36B;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="800" fill="url(#bg)"/>
  
  <!-- Subtle glow -->
  <ellipse cx="300" cy="320" rx="200" ry="250" fill="url(#glow)"/>
  
  <!-- Bottle silhouette -->
  <g opacity="0.15">
    <!-- Cap -->
    <rect x="260" y="120" width="80" height="40" rx="4" fill="url(#gold)"/>
    <!-- Neck -->
    <rect x="280" y="160" width="40" height="60" fill="url(#gold)"/>
    <!-- Shoulder -->
    <path d="M280 220 Q280 240 200 280 L200 280 L400 280 Q320 240 320 220 Z" fill="url(#gold)"/>
    <!-- Body -->
    <rect x="200" y="280" width="200" height="300" rx="8" fill="url(#gold)"/>
    <!-- Base -->
    <rect x="190" y="580" width="220" height="20" rx="4" fill="url(#gold)"/>
  </g>
  
  <!-- Light reflection on bottle -->
  <g opacity="0.08">
    <rect x="220" y="290" width="30" height="250" rx="15" fill="white"/>
  </g>
  
  <!-- SMAR'S Logo -->
  <text x="300" y="460" font-family="'Playfair Display', Georgia, serif" font-size="42" font-weight="700" fill="url(#gold)" text-anchor="middle" letter-spacing="6" opacity="0.9">SMAR'S</text>
  <text x="300" y="485" font-family="'Playfair Display', Georgia, serif" font-size="10" fill="url(#gold)" text-anchor="middle" letter-spacing="8" opacity="0.6">FRAGRANCE</text>
  
  <!-- Tagline -->
  <text x="300" y="700" font-family="'Playfair Display', Georgia, serif" font-size="11" fill="url(#gold)" text-anchor="middle" letter-spacing="2" font-style="italic" opacity="0.4">Scents that defines you.</text>
  
  <!-- Decorative line -->
  <line x1="250" y1="500" x2="350" y2="500" stroke="url(#gold)" stroke-width="0.5" opacity="0.3"/>
</svg>
